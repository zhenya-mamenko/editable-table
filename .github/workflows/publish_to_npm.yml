name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          always-auth: false
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  example:
    needs: build
    # The called workflow deploys to GitHub Pages, it can't get more permissions than the caller grants
    permissions:
      contents: write
    uses: ./.github/workflows/publish_example.yml
